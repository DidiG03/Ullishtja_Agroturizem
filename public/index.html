      :root{--primary-forest:#1a2e22;--secondary-terracotta:#a0522d;--accent-gold:#c9a96e;--olive-green:#4a6741;--warm-gold:#b8976a;--cream:#f8f5f0;--dark-bg:#0d1b12;--text-primary:#1a1a1a;--text-secondary:#5a5a5a;--text-light:#6e6e6e;--gold-ink:#7d6033;--content-max:1200px;--gutter:20px;--radius-sm:4px;--section-y:120px}
      @media(max-width:768px){:root{--section-y:72px}}
      @media(max-width:480px){:root{--section-y:56px}}
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;background:var(--cream);color:var(--text-primary);font-family:'Cormorant Garamond','Georgia',serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

      /* Navbar — Premium Glass */
      .navbar{position:fixed;top:0;left:0;right:0;background:#0d1b12;padding:calc(1rem + env(safe-area-inset-top,0px)) 0 1rem;box-shadow:none;border-bottom:1px solid rgba(201,169,110,.15);z-index:1000}
      .nav-container{max-width:var(--content-max);margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;justify-content:flex-start}
      .nav-container--logo-only{justify-content:flex-start}
      .logo-home-link{text-decoration:none;display:inline-flex;align-items:center}
      .logo{height:56px;width:70px;border-radius:var(--radius-sm);display:block}

      /* Hero — Dark Cinematic */
      /* Hero poster (LCP). These media conditions are mirrored by the preload tags
         above and by .hero-bg-image in src/App.css — keep all three in sync. */
      .hero-bg-image{position:absolute;top:0;left:0;width:100%;height:100%;background-color:var(--dark-bg);background-size:cover;background-position:center;background-repeat:no-repeat}
      .hero-bg-image--mobile{background-image:url(/images/posters/hero-poster-mobile-900.webp)}
      .hero-bg-image--desktop{display:none;background-position:center 35%;background-image:url(/images/posters/hero-poster-1200.webp)}
      @media(min-width:1281px){.hero-bg-image--desktop{background-image:url(/images/posters/hero-poster-1600.webp)}}
      .hero{min-height:100vh;display:flex;align-items:center;padding:calc(72px + env(safe-area-inset-top,0px)) 0 64px;background-size:cover;background-position:center;position:relative;overflow:hidden}
      .hero-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(13,27,18,.75) 0%,rgba(13,27,18,.55) 40%,rgba(13,27,18,.7) 70%,rgba(13,27,18,.9) 100%);z-index:1}
      .hero-container{max-width:var(--content-max);margin:0 auto;padding:0 var(--gutter);position:relative;z-index:2;width:100%}
      .hero-content{z-index:10}
      .hero-title{font-family:'Playfair Display',serif;font-size:2.8rem;line-height:1.15;margin-bottom:1rem;color:#fff;letter-spacing:-.01em}
      .hero-description{font-size:1.25rem;line-height:1.9;color:rgba(255,255,255,.85);max-width:90%;margin-bottom:2rem;font-weight:300}
      .hero-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
      .cta-button{display:inline-flex;align-items:center;gap:.5rem;padding:1rem 2.2rem;border-radius:0;text-decoration:none;font-weight:500;font-size:.8rem;transition:all .3s;letter-spacing:2px;text-transform:uppercase;font-family:'Inter',sans-serif}
      .cta-button.primary{background:var(--accent-gold);color:var(--dark-bg);border:1px solid var(--accent-gold)}
      .cta-button.secondary{background:transparent;color:#fff;border:1px solid rgba(201,169,110,.5)}
      .hero-visual{z-index:10;display:none}

      /* Sections — values mirror src/App.css so first paint matches the loaded stylesheet */
      .container{max-width:var(--content-max);margin:0 auto;padding:0 var(--gutter)}
      .about{padding:var(--section-y) 0 0}
      .contact,.events-section,.alacarte-section{padding:var(--section-y) 0}
      .section-text{font-size:1.15rem;line-height:1.9;color:var(--text-secondary)}
      .section-subtitle{color:var(--gold-ink);font-size:.75rem;margin-bottom:2rem;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;font-family:'Inter',sans-serif}
      .section-grid{display:grid;gap:2rem}
      .section-grid.reverse .section-image{order:1}
      .section-grid.reverse .section-content{order:2}
      .contact-item h4{margin:0 0 .5rem;font-family:'Playfair Display',serif}

      /* Footer */
      .footer{background:var(--dark-bg);color:#fff;padding:5rem 0 2rem;border-top:1px solid rgba(201,169,110,.15)}
      .footer-logo{height:72px;width:auto;max-width:160px;border-radius:var(--radius-sm)}
      .footer-title{color:var(--accent-gold);font-size:.75rem;margin:0;padding-bottom:.75rem;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:2.5px;font-weight:500}
      .footer .contact-value,.footer .contact-link{color:rgba(255,255,255,.7);text-decoration:none}
      .footer-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:2rem;padding-top:1.5rem;text-align:center;font-size:.85rem;color:rgba(255,255,255,.5)}
      .footer-nav{display:flex;flex-direction:column;gap:.5rem}
      .footer-link{color:rgba(255,255,255,.6);text-decoration:none;font-size:.9rem;font-family:'Inter',sans-serif;padding:.25rem 0 .25rem .75rem}

      /* Misc */
      .noscript-banner{background:var(--primary-forest);color:#fff;text-align:center;padding:10px 15px;font-size:14px}

      /* Desktop breakpoint */
      @media(min-width:769px){
        .hero-bg-image--mobile{display:none}
        .hero-bg-image--desktop{display:block}
        .hero{min-height:100vh;padding:100px 0 24px}
